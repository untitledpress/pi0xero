# Copy this file to config.ini and fill in client_id.

[xero]
# Client id of the Xero app you create at https://developer.xero.com/app/manage
client_id =
# Must match the redirect URI in the Xero app: http://localhost:5055/callback
redirect_port = 5055
# Leave blank to use the organisation picked at login.
tenant_id =

[display]
# Waveshare driver module. Check the sticker on the back of the HAT:
#   V4 -> epd2in13_V4   V3 -> epd2in13_V3   V2 -> epd2in13_V2
#   red/black B V4 -> epd2in13b_V4
model = epd2in13_V4
# Folder that contains the waveshare_epd package (install.sh puts it here).
waveshare_lib = ~/e-Paper/RaspberryPi_JetsonNano/python/lib
# 0 or 180. Use 180 if the screen is mounted upside down.
rotate = 0
# Text in the top bar. Blank = organisation name from Xero.
title =
# Blank = worked out from the organisation's base currency.
currency_symbol =
